name: Ingesta Automatizada de Viviendas (HabitApp Cron)

on:
  # Programado 2 veces al día (8:00 AM y 6:00 PM hora Colombia / UTC 13:00 y 23:00)
  schedule:
    - cron: '0 13,23 * * *'
  # Permite ejecución manual desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Ingesta Multi-Fuente
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run import-listings

      - name: Generar Sitemap.xml actualizado
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run generate-sitemap
